server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name traceonsnow.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://traceonsnow.com$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name traceonsnow.com;
    ssl_certificate /etc/letsencrypt/live/traceonsnow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/traceonsnow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    root /srv/site/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache";
    client_max_body_size 12m;
    location = /admin { include /etc/nginx/conf.d/payload-proxy.inc; }
    location /admin/ { include /etc/nginx/conf.d/payload-proxy.inc; }
    location /_next/ { include /etc/nginx/conf.d/payload-proxy.inc; }
    location /api/ { include /etc/nginx/conf.d/payload-proxy.inc; }
    location ^~ /api/media/file/ {
        # This prefix bypasses regex locations; private media settings stay private.
        if ($uri ~ "/[.]") { return 404; }
        alias /srv/media/;
        autoindex off;
        disable_symlinks on;
        limit_except GET HEAD { deny all; }
    }
    location ~ /\. { deny all; }
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /pagefind/ {
        try_files $uri =404;
        expires 1h;
    }
    location / { try_files $uri $uri/index.html =404; }
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
}
